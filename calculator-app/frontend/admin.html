<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налаштування калькулятора</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f1f3f8;
            min-height: 100vh
        }

        .header {
            background: linear-gradient(135deg, #1a2332, #2d3f5e);
            padding: 0 24px
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .logo span {
            font-size: 30px
        }

        .logo h1 {
            color: #fff;
            font-size: 19px;
            font-weight: 700
        }

        .logo p {
            color: #9eb5d8;
            font-size: 12px;
            margin-top: 2px
        }

        .btn-back {
            color: #d4e4ff;
            font-size: 13px;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, .2);
            background: rgba(255, 255, 255, .1);
            transition: .2s
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, .2)
        }

        .body {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px 80px
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px
        }

        .tab {
            padding: 10px 20px;
            border: 2px solid #dde3ef;
            border-radius: 10px;
            background: #fff;
            color: #6b7a99;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s
        }

        .tab.active {
            border-color: #3b82f6;
            background: #eff6ff;
            color: #1d4ed8
        }

        .panel {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
            display: none
        }

        .panel.active {
            display: block
        }

        .panel-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px
        }

        .panel-hdr h2 {
            font-size: 18px;
            color: #1e293b
        }

        .btn-add {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s
        }

        .btn-add:hover {
            background: #2563eb
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        th {
            padding: 10px 14px;
            text-align: left;
            color: #64748b;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 2px solid #e2e8f0;
            background: #f8fafc;
            white-space: nowrap
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155
        }

        tr:hover td {
            background: #f8fafc
        }

        .price {
            font-weight: 700;
            color: #1d4ed8
        }

        .acts {
            display: flex;
            gap: 6px
        }

        .btn-e,
        .btn-t {
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: .2s
        }

        .btn-e:hover,
        .btn-t:hover {
            background: #f1f5f9
        }

        .badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600
        }

        .on {
            background: #dcfce7;
            color: #16a34a
        }

        .off {
            background: #fef2f2;
            color: #dc2626
        }

        /* Modal */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000
        }

        .overlay.show {
            display: flex
        }

        .modal {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2)
        }

        .modal-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px
        }

        .modal-hdr h3 {
            font-size: 18px;
            color: #1e293b
        }

        .cls {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #64748b
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .field label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase
        }

        .field input,
        .field select {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            outline: none;
            transition: .2s
        }

        .field input:focus,
        .field select:focus {
            border-color: #3b82f6
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #475569;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }

        .btn-save {
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }

        .btn-save:disabled {
            opacity: .6
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            display: none
        }

        .toast.show {
            display: block
        }

        .toast.ok {
            background: #10b981
        }

        .toast.err {
            background: #ef4444
        }

        @media(max-width:640px) {
            .header-inner {
                flex-direction: column;
                gap: 10px
            }

            .tabs {
                flex-direction: column
            }

            th,
            td {
                padding: 7px 8px;
                font-size: 12px
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-inner">
            <div class="logo">
                <span>⚙️</span>
                <div>
                    <h1>Налаштування калькулятора</h1>
                    <p>Ціни на матеріали, фурнітуру і послуги</p>
                </div>
            </div>
            <a href="/" class="btn-back">← Конструктор</a>
        </div>
    </div>

    <div class="body">
        <div class="tabs">
            <button class="tab active" onclick="setTab('materials')">🪵 Матеріали</button>
            <button class="tab" onclick="setTab('hardware')">⚙️ Фурнітура</button>
            <button class="tab" onclick="setTab('services')">🔨 Послуги</button>
        </div>

        <div class="panel active" id="p-materials">
            <div class="panel-hdr">
                <h2>Матеріали</h2><button class="btn-add" onclick="openAdd()">+ Додати</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Назва</th>
                        <th>Товщина</th>
                        <th>Ціна / м²</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tb-materials"></tbody>
            </table>
        </div>
        <div class="panel" id="p-hardware">
            <div class="panel-hdr">
                <h2>Фурнітура</h2><button class="btn-add" onclick="openAdd()">+ Додати</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Назва</th>
                        <th>Бренд</th>
                        <th>Довжина</th>
                        <th>Категорія</th>
                        <th>Ціна</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tb-hardware"></tbody>
            </table>
        </div>
        <div class="panel" id="p-services">
            <div class="panel-hdr">
                <h2>Послуги</h2><button class="btn-add" onclick="openAdd()">+ Додати</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Назва</th>
                        <th>Ціна</th>
                        <th>Одиниця</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tb-services"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="modal-hdr">
                <h3 id="modal-title">Додати</h3><button class="cls" onclick="closeModal()">✕</button>
            </div>
            <div class="fields" id="modal-fields"></div>
            <div class="modal-foot">
                <button class="btn-cancel" onclick="closeModal()">Скасувати</button>
                <button class="btn-save" id="btn-save" onclick="doSave()">Зберегти</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        let curTab = 'materials', editId = null;
        const tabs = ['materials', 'hardware', 'services'];

        function setTab(t) {
            curTab = t;
            tabs.forEach(x => {
                document.getElementById('p-' + x).classList.toggle('active', x === t);
            });
            document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', tabs[i] === t));
            loadTab(t);
        }

        async function loadTab(t) {
            const data = await fetch(`${API}/api/calculator/${t}?active_only=false`).then(r => r.json());
            const tb = document.getElementById('tb-' + t);
            if (t === 'materials') {
                tb.innerHTML = data.map(m => `<tr>
      <td>${m.name}</td><td>${m.thickness_mm ? m.thickness_mm + 'мм' : '—'}</td>
      <td class="price">${m.price_per_m2} грн</td>
      <td><span class="badge ${m.is_active ? 'on' : 'off'}">${m.is_active ? 'Активний' : 'Вимкнений'}</span></td>
      <td class="acts">
        <button class="btn-e" onclick='openEdit(${JSON.stringify(m)})'>✏️</button>
        <button class="btn-t" onclick="toggle('materials',${m.id},${m.is_active})">${m.is_active ? '🔴' : '🟢'}</button>
      </td></tr>`).join('');
            } else if (t === 'hardware') {
                tb.innerHTML = data.map(h => `<tr>
      <td>${h.name}</td><td>${h.brand || '—'}</td>
      <td>${h.length_mm ? h.length_mm + 'мм' : '—'}</td><td>${h.category}</td>
      <td class="price">${h.price_per_unit} грн</td>
      <td><span class="badge ${h.is_active ? 'on' : 'off'}">${h.is_active ? 'Активна' : 'Вимкнена'}</span></td>
      <td class="acts">
        <button class="btn-e" onclick='openEdit(${JSON.stringify(h)})'>✏️</button>
        <button class="btn-t" onclick="toggle('hardware',${h.id},${h.is_active})">${h.is_active ? '🔴' : '🟢'}</button>
      </td></tr>`).join('');
            } else {
                tb.innerHTML = data.map(s => `<tr>
      <td>${s.name}</td><td class="price">${s.price} грн</td><td>${s.unit}</td>
      <td><span class="badge ${s.is_active ? 'on' : 'off'}">${s.is_active ? 'Активна' : 'Вимкнена'}</span></td>
      <td class="acts">
        <button class="btn-e" onclick='openEdit(${JSON.stringify(s)})'>✏️</button>
        <button class="btn-t" onclick="toggle('services',${s.id},${s.is_active})">${s.is_active ? '🔴' : '🟢'}</button>
      </td></tr>`).join('');
            }
        }

        function getFields(data = {}) {
            if (curTab === 'materials') return `
    <div class="field"><label>Назва</label><input id="f-name" value="${data.name || ''}"></div>
    <div class="field"><label>Товщина (мм)</label><input id="f-thick" type="number" value="${data.thickness_mm || 16}"></div>
    <div class="field"><label>Ціна за м²</label><input id="f-price" type="number" step="0.01" value="${data.price_per_m2 || 0}"></div>
    <div class="field"><label>Одиниця</label><input id="f-unit" value="${data.unit || 'м²'}"></div>`;
            if (curTab === 'hardware') return `
    <div class="field"><label>Назва</label><input id="f-name" value="${data.name || ''}"></div>
    <div class="field"><label>Бренд</label><input id="f-brand" value="${data.brand || ''}"></div>
    <div class="field"><label>Довжина (мм)</label><input id="f-len" type="number" value="${data.length_mm || ''}"></div>
    <div class="field"><label>Категорія</label>
      <select id="f-cat">
        ${['направляючі', 'ручки', 'петлі', 'інше'].map(c => `<option ${data.category === c ? 'selected' : ''}>${c}</option>`).join('')}
      </select></div>
    <div class="field"><label>Ціна (грн)</label><input id="f-price" type="number" step="0.01" value="${data.price_per_unit || 0}"></div>
    <div class="field"><label>Одиниця</label><input id="f-unit" value="${data.unit || 'пара'}"></div>`;
            return `
    <div class="field"><label>Назва</label><input id="f-name" value="${data.name || ''}"></div>
    <div class="field"><label>Ціна (грн)</label><input id="f-price" type="number" step="0.01" value="${data.price || 0}"></div>
    <div class="field"><label>Одиниця</label><input id="f-unit" value="${data.unit || 'шт'}"></div>`;
        }

        function openAdd() {
            editId = null;
            document.getElementById('modal-title').textContent = 'Додати';
            document.getElementById('modal-fields').innerHTML = getFields();
            document.getElementById('overlay').classList.add('show');
        }
        function openEdit(item) {
            editId = item.id;
            document.getElementById('modal-title').textContent = 'Редагувати';
            document.getElementById('modal-fields').innerHTML = getFields(item);
            document.getElementById('overlay').classList.add('show');
        }
        function closeModal() { document.getElementById('overlay').classList.remove('show'); }

        function getPayload() {
            const n = v => document.getElementById(n)?.value;
            if (curTab === 'materials') return {
                name: v('f-name'), thickness_mm: +v('f-thick') || null,
                price_per_m2: +v('f-price'), unit: v('f-unit')
            };
            if (curTab === 'hardware') return {
                name: v('f-name'), brand: v('f-brand') || null, length_mm: +v('f-len') || null,
                category: v('f-cat'), price_per_unit: +v('f-price'), unit: v('f-unit')
            };
            return { name: v('f-name'), price: +v('f-price'), unit: v('f-unit') };
        }
        function v(id) { return document.getElementById(id)?.value || ''; }

        async function doSave() {
            const btn = document.getElementById('btn-save');
            btn.disabled = true; btn.textContent = 'Зберігаю...';
            try {
                const url = editId ? `${API}/api/calculator/${curTab}/${editId}` : `${API}/api/calculator/${curTab}`;
                const method = editId ? 'PATCH' : 'POST';
                const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(getPayload()) });
                if (!r.ok) { const e = await r.json(); throw new Error(e.detail); }
                closeModal(); loadTab(curTab); showToast('Збережено!', 'ok');
            } catch (e) { showToast('Помилка: ' + e.message, 'err'); }
            finally { btn.disabled = false; btn.textContent = 'Зберегти'; }
        }

        async function toggle(type, id, cur) {
            await fetch(`${API}/api/calculator/${type}/${id}`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_active: !cur })
            });
            loadTab(type);
            showToast(cur ? 'Вимкнено' : 'Увімкнено', 'ok');
        }

        function showToast(msg, type = 'ok') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        loadTab('materials');
    </script>
</body>

</html>
