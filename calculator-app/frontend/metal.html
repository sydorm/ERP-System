<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Калькулятор металоконструкцій</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f7;
            min-height: 100vh
        }

        /* Header */
        .hdr {
            background: linear-gradient(135deg, #1c2b3a, #2e4057);
            padding: 0 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .3)
        }

        .hdr-in {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo span {
            font-size: 34px
        }

        .logo h1 {
            color: #fff;
            font-size: 19px;
            font-weight: 800
        }

        .logo p {
            color: #8fadc8;
            font-size: 12px;
            margin-top: 2px
        }

        .nav {
            display: flex;
            gap: 8px
        }

        .nbtn {
            color: #c8ddf0;
            font-size: 13px;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, .18);
            background: rgba(255, 255, 255, .08);
            transition: .2s
        }

        .nbtn:hover,
        .nbtn.on {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff
        }

        /* Page */
        .page {
            max-width: 1100px;
            margin: 22px auto;
            padding: 0 16px 80px
        }

        /* TOP FORM — horizontal grid on desktop */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px
        }

        @media(max-width:760px) {
            .form-grid {
                grid-template-columns: 1fr
            }
        }

        /* Cards */
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 18px 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .07)
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 7px;
            letter-spacing: .03em
        }

        .step {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0
        }

        /* Fields */
        .f {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 11px
        }

        .f:last-child {
            margin-bottom: 0
        }

        .f label {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase
        }

        .f input,
        .f select {
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 14px;
            color: #1e293b;
            outline: none;
            transition: .2s;
            background: #fff
        }

        .f input:focus,
        .f select:focus {
            border-color: #3b82f6
        }

        /* Profiles table */
        .profiles-card {
            margin-bottom: 14px
        }

        .prof-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        .prof-table th {
            padding: 7px 10px;
            text-align: left;
            color: #64748b;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid #f1f5f9;
            background: #f8fafc
        }

        .prof-table td {
            padding: 7px 8px;
            border-bottom: 1px solid #f8fafc;
            color: #334155;
            vertical-align: middle
        }

        .prof-table select,
        .prof-table input {
            border: 1.5px solid #e2e8f0;
            border-radius: 7px;
            padding: 5px 7px;
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            outline: none;
            transition: .2s;
            background: #fff;
            width: 100%
        }

        .prof-table select:focus,
        .prof-table input:focus {
            border-color: #3b82f6
        }

        .m2-badge {
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            padding: 5px 4px
        }

        .btn-del {
            border: none;
            background: none;
            cursor: pointer;
            color: #cbd5e1;
            font-size: 14px;
            padding: 3px 5px;
            border-radius: 5px;
            transition: .2s
        }

        .btn-del:hover {
            color: #ef4444;
            background: #fef2f2
        }

        .btn-add-row {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border: 2px dashed #cbd5e1;
            border-radius: 9px;
            background: none;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s
        }

        .btn-add-row:hover {
            border-color: #3b82f6;
            color: #2563eb;
            background: #eff6ff
        }

        /* Checkboxes */
        .chk-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px
        }

        .chi {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11.5px;
            color: #334155;
            cursor: pointer;
            padding: 5px 9px;
            border-radius: 7px;
            border: 1.5px solid #e2e8f0;
            transition: .2s;
            user-select: none;
            line-height: 1.2
        }

        .chi:hover {
            border-color: #93c5fd;
            background: #f0f7ff
        }

        .chi input {
            width: 13px;
            height: 13px;
            accent-color: #2563eb;
            flex-shrink: 0
        }

        .chi.on {
            border-color: #2563eb;
            background: #eff6ff
        }

        /* Counters */
        .ctr-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px
        }

        .ctr-block label {
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px
        }

        .ctr {
            display: flex;
            align-items: center;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden
        }

        .ctr button {
            width: 30px;
            height: 34px;
            border: none;
            background: #f1f5f9;
            color: #475569;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s
        }

        .ctr button:hover {
            background: #dbeafe
        }

        .ctr span {
            flex: 1;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #1e293b
        }

        /* Primer toggle */
        .primer-row {
            display: none;
            margin-top: 8px;
            animation: fadeIn .2s
        }

        .primer-row.show {
            display: block
        }

        /* Calc button */
        .btn-calc {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
            color: #fff;
            border: none;
            border-radius: 13px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(29, 78, 216, .35);
            transition: .2s;
            margin-bottom: 20px
        }

        .btn-calc:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(29, 78, 216, .45)
        }

        .btn-calc:disabled {
            opacity: .6;
            transform: none
        }

        /* Results */
        .results {
            display: none
        }

        .results.show {
            display: block
        }

        .m2-bar {
            background: linear-gradient(135deg, #1c2b3a, #2563eb);
            border-radius: 14px;
            padding: 16px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            margin-bottom: 14px
        }

        .m2-bar .lbl {
            font-size: 12px;
            color: #93c5fd;
            font-weight: 600
        }

        .m2-bar .val {
            font-size: 24px;
            font-weight: 800
        }

        .res-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 14px
        }

        @media(max-width:650px) {
            .res-grid {
                grid-template-columns: 1fr
            }
        }

        .rsec {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .07)
        }

        .rsec-hdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9
        }

        .rsec-title {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b
        }

        .rsec-sub {
            font-size: 16px;
            font-weight: 800;
            color: #2563eb
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px
        }

        th {
            padding: 7px 10px;
            text-align: left;
            color: #64748b;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            border-bottom: 2px solid #f1f5f9;
            background: #fafbfc
        }

        td {
            padding: 7px 10px;
            border-bottom: 1px solid #f8fafc;
            color: #334155
        }

        .nr {
            text-align: right;
            font-family: monospace
        }

        .tr {
            text-align: right;
            font-weight: 800;
            color: #1d4ed8
        }

        .grand {
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
            border-radius: 14px;
            padding: 20px 24px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .grand-lbl {
            font-size: 13px;
            color: #bfdbfe;
            margin-bottom: 3px
        }

        .grand-val {
            font-size: 34px;
            font-weight: 900
        }

        .grand-acts {
            display: flex;
            gap: 10px;
            margin-top: 10px
        }

        .gsave,
        .gprint {
            padding: 9px 16px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: .2s
        }

        .gsave {
            background: #10b981;
            color: #fff
        }

        .gprint {
            background: rgba(255, 255, 255, .15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .25)
        }

        .gprint:hover {
            background: rgba(255, 255, 255, .25)
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 11px 22px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            display: none;
            animation: slideUp .3s
        }

        .toast.show {
            display: block
        }

        .toast.ok {
            background: #10b981
        }

        .toast.err {
            background: #ef4444
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @media print {

            .hdr,
            .form-grid,
            .profiles-card,
            .btn-calc,
            .grand-acts,
            .toast {
                display: none !important
            }

            .results {
                display: block !important
            }
        }
    </style>
</head>

<body>
    <div class="hdr">
        <div class="hdr-in">
            <div class="logo">
                <span>🔩</span>
                <div>
                    <h1>Калькулятор металоконструкцій</h1>
                    <p>Профілі · Фарбування · Послуги · Накладні</p>
                </div>
            </div>
            <div class="nav">
                <a href="/" class="nbtn">🪵 Шухляди</a>
                <a href="/metal.html" class="nbtn on">🔩 Метал</a>
                <a href="/admin.html" class="nbtn">⚙️ Налаштування</a>
            </div>
        </div>
    </div>

    <div class="page">

        <!-- ── ROW 1: Виріб + Фарбування + Послуги ── -->
        <div class="form-grid">

            <!-- Виріб -->
            <div class="card">
                <div class="card-title"><span class="step">0</span> Виріб</div>
                <div class="f"><label>Назва виробу</label><input id="product-name" placeholder="Лорен / Каркас...">
                </div>
                <div class="f"><label>Клієнт</label><input id="client-name" placeholder="Іванов Іван"></div>
                <div class="f"><label>Примітки</label><input id="notes" placeholder="Колір, особливості..."></div>
            </div>

            <!-- Фарбування -->
            <div class="card">
                <div class="card-title"><span class="step">2</span> Фарбування (порошкове)</div>
                <div class="f"><label>Фарба</label>
                    <select id="paint-sel">
                        <option value="">— без фарбування —</option>
                    </select>
                </div>
                <label
                    style="display:flex;align-items:center;gap:8px;font-size:13px;color:#334155;cursor:pointer;margin-bottom:10px">
                    <input type="checkbox" id="with-primer" style="width:15px;height:15px;accent-color:#2563eb"
                        onchange="togglePrimer()"> З ґрунтовкою
                </label>
                <div class="primer-row" id="primer-row">
                    <div class="f"><label>Ґрунтовка</label>
                        <select id="primer-sel">
                            <option value="">— оберіть ґрунтовку —</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Послуги + лічильники -->
            <div class="card">
                <div class="card-title"><span class="step">3</span> Послуги та накладні</div>
                <div class="f"><label>Послуги виробництва</label>
                    <div class="chk-grid" id="work-grid"></div>
                </div>
                <div class="ctr-row">
                    <div class="ctr-block"><label>Зварювань</label>
                        <div class="ctr"><button onclick="chg('welder',-1)">−</button><span
                                id="welder-disp">1</span><button onclick="chg('welder',1)">+</button></div>
                    </div>
                    <div class="ctr-block"><label>Різань</label>
                        <div class="ctr"><button onclick="chg('cuts',-1)">−</button><span id="cuts-disp">0</span><button
                                onclick="chg('cuts',1)">+</button></div>
                    </div>
                </div>
                <div class="f" style="margin-top:12px"><label>Накладні витрати</label>
                    <div class="chk-grid" id="overhead-grid"></div>
                </div>
            </div>
        </div>

        <!-- ── ROW 2: Профілі (full-width) ── -->
        <div class="card profiles-card">
            <div class="card-title"><span class="step">1</span> Профілі та матеріал</div>
            <table class="prof-table">
                <thead>
                    <tr>
                        <th style="width:40%">Профіль</th>
                        <th>Метри (м)</th>
                        <th>К-сть</th>
                        <th style="width:80px">М²</th>
                        <th style="width:30px"></th>
                    </tr>
                </thead>
                <tbody id="profile-rows"></tbody>
            </table>
            <button class="btn-add-row" onclick="addRow()">+ Додати профіль</button>
        </div>

        <!-- ── CALCULATE ── -->
        <button class="btn-calc" id="btn-calc" onclick="calculate()">🔩 Розрахувати вартість</button>

        <!-- ── RESULTS ── -->
        <div class="results" id="results">
            <div class="m2-bar">
                <div>
                    <div class="lbl">Загальна площа поверхні</div>
                    <div class="val" id="r-m2">—</div>
                </div>
                <div style="font-size:13px;color:#93c5fd;text-align:right" id="r-title">Виріб</div>
            </div>
            <div class="res-grid" id="res-grid"></div>
            <div class="grand">
                <div>
                    <div class="grand-lbl">ЗАГАЛЬНА ВАРТІСТЬ</div>
                    <div style="font-size:12px;color:#93c5fd" id="r-sub"></div>
                    <div class="grand-acts">
                        <button class="gsave" onclick="saveQuote()">💾 Зберегти</button>
                        <button class="gprint" onclick="window.print()">🖨️ Друк</button>
                    </div>
                </div>
                <div class="grand-val"><span id="r-total">—</span><span
                        style="font-size:18px;opacity:.7;margin-left:4px">грн</span></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        let profiles = [], paints = [], workItems = [], overheads = [];
        let form = { welder: 1, cuts: 0 };
        let lastResult = null, lastInp = null, rowId = 0;

        async function init() {
            const [p, pa, w, o] = await Promise.all([
                fetch(`${API}/api/metal/profiles`).then(r => r.json()),
                fetch(`${API}/api/metal/paints`).then(r => r.json()),
                fetch(`${API}/api/metal/work-items`).then(r => r.json()),
                fetch(`${API}/api/metal/overhead`).then(r => r.json()),
            ]);
            profiles = p; paints = pa; workItems = w; overheads = o;

            const ps = document.getElementById('paint-sel'), pr = document.getElementById('primer-sel');
            paints.filter(x => x.paint_type === 'фарба').forEach(x => ps.add(new Option(`${x.name}  (${x.price_per_kg} грн/кг)`, x.id)));
            paints.filter(x => x.paint_type === 'ґрунтовка').forEach(x => pr.add(new Option(`${x.name}  (${x.price_per_kg} грн/кг)`, x.id)));

            const wg = document.getElementById('work-grid');
            workItems.forEach(w => {
                const lbl = document.createElement('label');
                lbl.className = 'chi'; lbl.dataset.id = w.id;
                const sub = w.pricing_type === 'per_m2' ? `${w.price}/м²` : w.pricing_type === 'fixed' ? `${w.price} фікс` : `${w.price}/${w.unit}`;
                lbl.innerHTML = `<input type="checkbox" value="${w.id}"> ${w.name} <small style="color:#94a3b8;margin-left:3px">${sub}</small>`;
                lbl.querySelector('input').addEventListener('change', e => lbl.classList.toggle('on', e.target.checked));
                wg.appendChild(lbl);
                if (w.pricing_type === 'per_m2') { lbl.querySelector('input').checked = true; lbl.classList.add('on'); }
            });

            const og = document.getElementById('overhead-grid');
            overheads.forEach(o => {
                const lbl = document.createElement('label');
                lbl.className = 'chi';
                lbl.innerHTML = `<input type="checkbox" value="${o.id}"> ${o.name} <small style="color:#94a3b8;margin-left:3px">${o.price} грн</small>`;
                lbl.querySelector('input').addEventListener('change', e => lbl.classList.toggle('on', e.target.checked));
                og.appendChild(lbl);
            });

            addRow();
        }

        function addRow() {
            const id = ++rowId;
            const opts = profiles.map(p => `<option value="${p.id}" data-per="${p.perimeter_m}">${p.name} — ${p.price_per_meter} грн/м</option>`).join('');
            const tr = document.createElement('tr');
            tr.id = `row-${id}`;
            tr.innerHTML = `
    <td><select onchange="recalcRow(${id})">${opts}</select></td>
    <td><input type="number" id="len-${id}" value="1" min="0.01" step="0.01" style="width:80px" oninput="recalcRow(${id})"></td>
    <td><input type="number" id="qty-${id}" value="1" min="1" style="width:60px" oninput="recalcRow(${id})"></td>
    <td><div class="m2-badge" id="m2-${id}">—</div></td>
    <td><button class="btn-del" onclick="delRow(${id})" title="Видалити">✕</button></td>`;
            document.getElementById('profile-rows').appendChild(tr);
            recalcRow(id);
        }

        function delRow(id) {
            if (document.querySelectorAll('.prof-table tbody tr').length > 1)
                document.getElementById(`row-${id}`).remove();
            else showToast('Мінімум 1 рядок', 'err');
        }

        function recalcRow(id) {
            const sel = document.querySelector(`#row-${id} select`);
            const per = parseFloat(sel?.options[sel.selectedIndex]?.dataset.per) || 0;
            const len = parseFloat(document.getElementById(`len-${id}`)?.value) || 0;
            const qty = parseFloat(document.getElementById(`qty-${id}`)?.value) || 1;
            const m2 = (per * len * qty);
            const el = document.getElementById(`m2-${id}`);
            if (el) el.textContent = m2.toFixed(4) + ' м²';
        }

        function togglePrimer() { document.getElementById('primer-row').classList.toggle('show', document.getElementById('with-primer').checked); }
        function chg(k, d) { form[k] = Math.max(0, form[k] + d); document.getElementById(k === 'welder' ? 'welder-disp' : 'cuts-disp').textContent = form[k]; }

        async function calculate() {
            const btn = document.getElementById('btn-calc');
            btn.disabled = true; btn.textContent = '🔄 Рахую...';
            const rows = [...document.querySelectorAll('.prof-table tbody tr')].map(tr => {
                const id = tr.id.replace('row-', '');
                return {
                    profile_id: +tr.querySelector('select').value,
                    length_m: +(document.getElementById(`len-${id}`)?.value || 1),
                    quantity: +(document.getElementById(`qty-${id}`)?.value || 1)
                };
            }).filter(r => r.profile_id && r.length_m > 0);
            const paintId = document.getElementById('paint-sel').value;
            const withPrimer = document.getElementById('with-primer').checked;
            const primerId = document.getElementById('primer-sel').value;
            const wIds = [...document.querySelectorAll('#work-grid input:checked')].map(c => +c.value);
            const oIds = [...document.querySelectorAll('#overhead-grid input:checked')].map(c => +c.value);
            const inp = {
                product_name: document.getElementById('product-name').value || null,
                client_name: document.getElementById('client-name').value || null,
                rows, paint_id: paintId ? +paintId : null,
                with_primer: withPrimer, primer_id: primerId && withPrimer ? +primerId : null,
                work_item_ids: wIds, overhead_ids: oIds,
                welder_qty: form.welder, cuts_qty: form.cuts,
                notes: document.getElementById('notes').value || null
            };
            try {
                const r = await fetch(`${API}/api/metal/calculate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(inp) });
                if (!r.ok) { const e = await r.json(); throw new Error(e.detail || 'Помилка'); }
                lastResult = await r.json(); lastInp = inp;
                renderResults(lastResult);
            } catch (e) { showToast('Помилка: ' + e.message, 'err'); }
            finally { btn.disabled = false; btn.textContent = '🔩 Розрахувати вартість'; }
        }

        function makeTable(lines) {
            if (!lines.length) return '<p style="color:#94a3b8;font-size:13px;text-align:center;padding:8px">—</p>';
            return `<table><thead><tr><th>Назва</th><th class="nr">К-сть</th><th>Од.</th><th class="nr">Ціна</th><th class="nr">Сума</th></tr></thead><tbody>${lines.map(l => `<tr><td>${l.name}</td><td class="nr">${l.qty.toFixed(4)}</td><td>${l.unit}</td><td class="nr">${l.price_unit.toFixed(2)}</td><td class="tr">${l.total.toFixed(2)}</td></tr>`).join('')
                }</tbody></table>`;
        }

        function sec(icon, title, sub, content) {
            if (!sub) return '';
            return `<div class="rsec"><div class="rsec-hdr"><div class="rsec-title">${icon} ${title}</div><div class="rsec-sub">${sub.toFixed(2)} грн</div></div>${content}</div>`;
        }

        function renderResults(res) {
            document.getElementById('r-m2').textContent = res.total_m2.toFixed(4) + ' м²';
            document.getElementById('r-title').innerHTML = (res.product_name ? `<strong>"${res.product_name}"</strong><br>` : '') + `Від ${res.metal_lines.length} профілів`;
            document.getElementById('r-total').textContent = res.grand_total.toFixed(2);
            document.getElementById('r-sub').textContent = (res.product_name ? `"${res.product_name}" · ` : '') + 'Площа: ' + res.total_m2.toFixed(4) + ' м²';
            document.getElementById('res-grid').innerHTML =
                sec('🔩', 'Прорахунок метал', res.metal_subtotal, makeTable(res.metal_lines)) +
                sec('🎨', 'Фарбування', res.coating_subtotal, makeTable(res.coating_lines)) +
                sec('⚙️', 'Послуги виробництва', res.work_subtotal, makeTable(res.work_lines)) +
                sec('📊', 'Накладні витрати', res.overhead_subtotal, makeTable(res.overhead_lines));
            const el = document.getElementById('results');
            el.classList.add('show');
            setTimeout(() => el.scrollIntoView({ behavior: 'smooth' }), 100);
        }

        async function saveQuote() {
            if (!lastResult) return;
            try {
                await fetch(`${API}/api/metal/save-quote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_name: lastResult.product_name, client_name: lastInp?.client_name, inp: lastInp, result: lastResult })
                });
                showToast('Розрахунок збережено!', 'ok');
            } catch { showToast('Не вдалося зберегти', 'err'); }
        }

        function showToast(msg, type = 'ok') {
            const t = document.getElementById('toast');
            t.textContent = msg; t.className = 'toast show ' + type;
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        init();
    </script>
</body>

</html>
